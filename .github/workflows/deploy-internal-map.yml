# AI-assisted: generated with Claude Code, reviewed by Periélio (pending Ravi)
# Deploys the internal map (apps/web) to Cloudflare Pages, project "nether-field-map".
# One-time setup (create the project, token permissions, secrets): see issue #18 and the PR that added this file.
name: Deploy internal map

on:
  push:
    branches: [dev]
    paths:
      - "apps/web/**"
      - ".github/workflows/deploy-internal-map.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-internal-map
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check that apps/web exists
        id: web
        run: |
          if [ -f apps/web/package.json ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::apps/web is not set up yet (issue #12); skipping deploy"
          fi

      - name: Check the Cloudflare secrets
        if: steps.web.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing. Set them with: gh secret set <NAME> -R raviproenca/nether-field-shift-2026 (see issue #18)."
            exit 1
          fi

      - name: Set up Node.js
        if: steps.web.outputs.ready == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.3" # Node 24 LTS (Krypton)
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        if: steps.web.outputs.ready == 'true'
        working-directory: apps/web
        run: npm ci

      # API_URL is a repository Variable (not a secret). Empty: the dashboard shows its saved example.
      - name: Build
        if: steps.web.outputs.ready == 'true'
        working-directory: apps/web
        env:
          VITE_API_URL: ${{ vars.API_URL }}
        run: npm run build

      - name: Check the build output
        if: steps.web.outputs.ready == 'true'
        run: test -f apps/web/dist/index.html || { echo "::error::apps/web/dist/index.html not found after the build"; exit 1; }

      # --branch=main makes this the production deployment (nether-field-map.pages.dev),
      # because the project was created with --production-branch=main.
      - name: Deploy to Cloudflare Pages
        if: steps.web.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.156.0"
          command: pages deploy apps/web/dist --project-name=nether-field-map --branch=main --commit-dirty=true
